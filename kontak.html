<style>
/* ♡ EXTRA ROUND & BUBBLY SHAPES ♡ */

/* Jarak antarbaris lebih lega */
table {
  border-spacing: 0 12px !important;
}

/* Header lebih rounded */
table thead th:first-child {
  border-radius: 24px 10px 10px 24px !important;
}

table thead th:last-child {
  border-radius: 10px 24px 24px 10px !important;
}

/* Semua sel lebih lembut */
table tbody td {
  padding: 17px 18px !important;
  border-top: 1px solid rgba(128,128,128,.12) !important;
  border-bottom: 1px solid rgba(128,128,128,.12) !important;
}

/* Ujung baris seperti pillowy cards */
table tbody td:first-child {
  border-radius: 24px 8px 8px 24px !important;
  border-left: 1px solid rgba(128,128,128,.12) !important;
}

table tbody td:last-child {
  border-radius: 8px 24px 24px 8px !important;
  border-right: 1px solid rgba(128,128,128,.12) !important;
}

/* Baris genap: bentuk bubble asimetris */
table tbody tr:nth-child(even) td:first-child {
  border-radius: 12px 24px 24px 12px !important;
}

table tbody tr:nth-child(even) td:last-child {
  border-radius: 24px 12px 12px 24px !important;
}

/* Hover makin bubbly */
table tbody tr:hover {
  transform: translateY(-4px) scale(1.008);
}

table tbody tr:hover td:first-child {
  border-radius: 28px 10px 10px 28px !important;
}

table tbody tr:hover td:last-child {
  border-radius: 10px 28px 28px 10px !important;
}

/* Animasi halus */
table tbody tr {
  transition: transform .3s ease;
}

/* Mobile */
@media (max-width: 600px) {
  table {
    border-spacing: 0 8px !important;
  }

  table tbody td {
    padding: 13px 11px !important;
  }

  table tbody td:first-child {
    border-radius: 18px 6px 6px 18px !important;
  }

  table tbody td:last-child {
    border-radius: 6px 18px 18px 6px !important;
  }

  table tbody tr:hover {
    transform: translateY(-2px);
  }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  table tbody tr {
    transition: none !important;
  }

  table tbody tr:hover {
    transform: none;
  }
}
</style>
